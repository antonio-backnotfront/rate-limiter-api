spring:
  profiles:
    active: test
  jpa:
    database: h2
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  cache:
    type: simple
  data:
    redis:
      host: localhost
      port: 6379

application:
  security:
    jwt:
      secret-key: test-secret-key-that-should-be-at-least-256-bits-long-for-security
      access-token-expiration: 86400000 # 24 hours
      refresh-token-expiration: 604800000 # 7 days

logging:
  level:
    io.github.antonio.backnotfront.ratelimiter: DEBUG
    org.springframework.security: DEBUG